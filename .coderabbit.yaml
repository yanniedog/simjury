# CodeRabbit — https://docs.coderabbit.ai/getting-started/yaml-configuration
# Manual re-review: comment `@coderabbitai review` on the PR.
language: en-US
# Only high-impact findings — no style/nits (also use reviews.profile: quiet).
tone_instructions: >-
  Report only high-severity issues: correctness bugs, security holes, data loss,
  broken player flows, or fiction-safety (real names in player-visible text).
  Skip style, renames, optional refactors, and low-confidence nits.
reviews:
  profile: quiet
  request_changes_workflow: false
  # No walkthrough / summary spam — keep inline findings only.
  high_level_summary: false
  high_level_summary_in_walkthrough: false
  poem: false
  review_status: false
  review_details: false
  in_progress_fortune: false
  changed_files_summary: false
  sequence_diagrams: false
  estimate_code_review_effort: false
  assess_linked_issues: false
  related_issues: false
  related_prs: false
  suggested_labels: false
  suggested_reviewers: false
  enable_prompt_for_ai_agents: true
  path_filters:
    - "!**/node_modules/**"
    - "!**/dist/**"
    - "!**/build/**"
    - "!**/.gradle/**"
    - "!**/pilot/local.properties"
    - "!**/*.lock"
    - "!**/package-lock.json"
    - "!site/art/**"
  path_instructions:
    - path: "site/app/**"
      instructions: >-
        Only high-severity issues. Flag broken flows, data loss, and
        fiction-safety (real names of people/companies/brands/places in
        player-visible text). Ignore style and optional refactors.
    - path: "site/public/cases/**"
      instructions: >-
        Only high-severity fiction/case integrity issues (e.g. real-name
        leaks). Do not nitpick wording.
    - path: "pilot/**"
      instructions: >-
        Only high-severity: accidental pilot CI/APK re-enablement or invented
        testimony without sources. Ignore style.
    - path: ".github/workflows/**"
      instructions: >-
        Only high-severity CI/gate breakages (e.g. reintroducing agent
        watch/poll loops). Ignore cosmetic workflow nits.
    - path: "docs/**"
      instructions: Only flag docs that would cause incorrect operator actions.
  auto_review:
    enabled: true
    drafts: true
    auto_incremental_review: true
    auto_pause_after_reviewed_commits: 8
    ignore_title_keywords:
      - "chore:"
      - "chore("
      - "wip"
      - "do not review"
    base_branches:
      - ".*"
chat:
  auto_reply: true
