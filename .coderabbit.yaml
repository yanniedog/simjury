# CodeRabbit — https://docs.coderabbit.ai/getting-started/yaml-configuration
# Prefer vendor auto-review (one pass per open/sync). Agents must NOT spam
# `@coderabbitai full review` unless status is missing/skipped/rate-limit-due.
language: en-US
tone_instructions: >-
  Balanced medium review: flag real bugs, security issues, data loss, broken player flows,
  fiction-safety risks, and clear maintainability or logic risks. Skip style, formatting,
  renames, optional refactors, and low-confidence nits.
reviews:
  profile: chill
  request_changes_workflow: false
  # Lean output — faster reviews, less quota burn on prose.
  high_level_summary: false
  high_level_summary_in_walkthrough: false
  poem: false
  review_status: true
  review_details: false
  review_progress: false
  commit_status: true
  fail_commit_status: true
  in_progress_fortune: false
  changed_files_summary: false
  sequence_diagrams: false
  estimate_code_review_effort: false
  assess_linked_issues: false
  related_issues: false
  related_prs: false
  suggested_labels: false
  suggested_reviewers: false
  enable_prompt_for_ai_agents: false
  path_filters:
    - "!**/node_modules/**"
    - "!**/dist/**"
    - "!**/build/**"
    - "!**/.gradle/**"
    - "!**/pilot/**"
    - "!**/archive/**"
    - "!**/artifacts/**"
    - "!**/pilot/local.properties"
    - "!**/*.lock"
    - "!**/package-lock.json"
    - "!site/art/**"
    # Exclusions only. A single positive pattern would switch CodeRabbit into
    # allowlist mode, where everything not named is "included by none" — which
    # is exactly how every source file stopped being reviewed.
    # Every exclusion above is scoped by directory, never by file extension.
    # An extension rule reaches into site/app/public/media/**, and excluding
    # player media is what makes a media-only Daily Docket PR skip entirely:
    # CodeRabbit reviews nothing, so the presence gate never sees "Review
    # completed". Source art is excluded by directory (site/art/**) instead.
    # pr:coderabbit-filters:verify enforces both halves of this.
  path_instructions:
    - path: "site/app/**"
      instructions: >-
        Balanced review. Flag broken flows, data loss, security issues, logic bugs,
        and fiction-safety (real names of people/companies/brands/places in
        player-visible text). Mention clear maintainability risks. Ignore pure
        style and optional refactors.
    - path: "site/app/docket/**"
      instructions: >-
        Flag fiction/case integrity issues (e.g. real-name leaks) and material
        contradictions that would confuse players. Do not nitpick wording polish.
    - path: ".github/workflows/**"
      instructions: >-
        Flag CI/gate breakages (e.g. reintroducing agent watch/poll loops),
        permission mistakes, and merge-protection gaps. Ignore cosmetic workflow nits.
    - path: "docs/**"
      instructions: >-
        Flag docs that would cause incorrect operator actions. Skip wording polish.
  auto_review:
    # One vendor-owned review on ready PRs. Incremental on later pushes is
    # cheaper than agents posting repeated `@coderabbitai full review`.
    # Drafts stay off so WIP burns no quota.
    enabled: true
    drafts: false
    auto_incremental_review: true
    base_branches:
      - main
chat:
  auto_reply: false
