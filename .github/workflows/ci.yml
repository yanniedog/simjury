name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Verify required docs exist
        run: |
          set -euo pipefail
          for f in README.md DAILY-PIVOT.md ROADMAP.md WORKFLOW.md AGENTS.md CLAUDE.md docs/DAILY-CASES.md; do
            test -f "$f" || { echo "Missing $f"; exit 1; }
          done
          test -d .projectmem || { echo "Missing .projectmem"; exit 1; }
          test -f .projectmem/events.jsonl || { echo "Missing projectmem events"; exit 1; }

      - name: Validate projectmem config
        run: |
          test -f .projectmem/config.toml
          test -f .projectmem/AI_INSTRUCTIONS.md

      - name: Check repository policy references
        run: |
          grep -q "Daily Docket" AGENTS.md
          grep -q "Daily Docket" ROADMAP.md
          grep -q "only required checks" AGENTS.md
          grep -q "validate.*bot-feedback-gate" .github/BRANCH_PROTECTION.md
          test -f WORKFLOW.md
          test -f .github/MERGE_POLICY.md
          test -f .github/rulesets/main-bot-gates.json
          test -x .github/scripts/assert-pr-mergeable.sh || test -f .github/scripts/assert-pr-mergeable.sh

      - uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Verify PR gate scripts
        run: |
          npm run pr:gate-logic:verify
          npm run pr:gate-exempt-policy:verify
          npm run pr:bot-wait-or-groups:verify
          npm run pr:base-guard:verify
          npm run pr:arm-and-park:verify
          npm run pr:coderabbit-contract:verify
          npm run pr:coderabbit-review-recovery:verify
          npm run pr:coderabbit-rate-limit-retry:verify
          npm run github:bot-gates:operator
