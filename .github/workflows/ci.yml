name: ci

on:
  pull_request:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Verify required docs exist
        run: |
          set -euo pipefail
          for f in README.md COURT-WEEK.md DAILY-PIVOT.md ROADMAP.md WORKFLOW.md AGENTS.md CLAUDE.md docs/DESIGN-PROTOCOL.md; do
            test -f "$f" || { echo "Missing $f"; exit 1; }
          done
          test -d .projectmem || { echo "Missing .projectmem"; exit 1; }
          test -f .projectmem/events.jsonl || { echo "Missing projectmem events"; exit 1; }

      - name: Validate projectmem config
        run: |
          test -f .projectmem/config.toml
          test -f .projectmem/AI_INSTRUCTIONS.md

      - name: Check repository policy references
        run: |
          grep -q "Court Week" AGENTS.md
          grep -q "Court Week" ROADMAP.md
          grep -q "only required checks" AGENTS.md
          grep -q "validate.*bot-feedback-gate" .github/BRANCH_PROTECTION.md
          test -f WORKFLOW.md
          test -f .github/MERGE_POLICY.md
          test -f .github/rulesets/main-bot-gates.json
          test -x .github/scripts/assert-pr-mergeable.sh || test -f .github/scripts/assert-pr-mergeable.sh

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: site/app/package-lock.json

      - name: Verify PR gate scripts
        run: |
          npm run pr:gate-logic:verify
          npm run pr:gate-exempt-policy:verify
          npm run pr:bot-wait-or-groups:verify
          npm run pr:base-guard:verify
          npm run pr:arm-and-park:verify
          npm run pr:coderabbit-filters:verify
          npm run pr:coderabbit-contract:verify
          npm run pr:coderabbit-review-recovery:verify
          npm run pr:coderabbit-rate-limit-retry:verify
          npm run github:bot-gates:operator

      - name: Install Court Week dependencies
        working-directory: site/app
        run: npm ci

      - name: Install site tooling for art-strip proof
        working-directory: site
        run: npm ci

      - name: Lint Court Week
        working-directory: site/app
        run: npm run lint

      - name: Typecheck Court Week
        working-directory: site/app
        run: npm run typecheck

      - name: Test Court Week
        working-directory: site/app
        run: npm test

      - name: Audit Court Week scene-art contract
        working-directory: site/app
        run: npm run media:art:test

      - name: Prove deterministic Court Week art strips
        working-directory: site
        run: npm run check:art-strips

      - name: Audit retired Daily Docket archive provenance
        working-directory: site
        run: npm run check:archive

      - name: Validate Court Week
        working-directory: site/app
        run: npm run validate:cases

      - name: Build Court Week
        working-directory: site/app
        run: npm run build
