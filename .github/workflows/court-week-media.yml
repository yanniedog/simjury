name: court-week-media

# Trusted, explicit production path only. It never runs for pull requests,
# forks or schedules. Review builds are read-only; only the separately gated
# publish job receives contents:write.
on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Immutable tag (court-week-cw-0001-YYYY.MM.DD-rN)
        required: true
        default: court-week-cw-0001-2026.08.03-r1
      publish:
        description: Publish after validation; false produces a review artifact only
        required: true
        type: boolean
        default: false
      reviewed_run_id:
        description: Prior workflow run id whose public Release artifact was reviewed (required when publish=true)
        required: false
        type: string
        default: ""

permissions:
  contents: read

concurrency:
  group: court-week-media-${{ inputs.release_tag }}
  cancel-in-progress: false

jobs:
  source:
    if: >-
      github.ref == 'refs/heads/main' &&
      github.event.repository.fork == false &&
      inputs.publish != true
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: site/app/package-lock.json
      - name: Install pinned application dependencies
        working-directory: site/app
        run: npm ci
      - name: Validate the exact reviewed Court Week source
        working-directory: site/app
        run: npm run lint && npm run typecheck && npm test && npm run media:art:test && npm run validate:cases && npm run build
      - name: Build deterministic prerecorded-audio jobs
        working-directory: site/app
        run: npm run media:audio:jobs -- --output ../../.court-week-audio-jobs
      - name: Record exact-source review status without blocking review media
        working-directory: site/app
        run: npm run review:signoffs -- --report ../../.court-week-audio-jobs/review-signoffs.json
      - name: Build the strict 55-scene art requirements
        working-directory: site/app
        run: >-
          npm run media:art:requirements --
          --output ../../.court-week-audio-jobs/scene-art-requirements.json
      - name: Match the requested immutable tag to the reviewed manifest
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: >-
          node -e "const fs=require('node:fs');const i=JSON.parse(fs.readFileSync('.court-week-audio-jobs/index.json'));
          if(i.releaseTag!==process.env.RELEASE_TAG)throw new Error('Requested release tag does not match reviewed CourtWeekManifest')"
      - name: Validate every source job without loading a voice model
        run: |
          set -euo pipefail
          for job in .court-week-audio-jobs/jobs/*.json; do
            python site/scripts/generate-court-week-audio.py "$job" .court-week-audio --validate-only
          done
      - uses: actions/upload-artifact@v4
        with:
          name: court-week-audio-jobs
          path: .court-week-audio-jobs/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7

  audio:
    needs: source
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        session:
          - cw-0001-monday
          - cw-0001-tuesday
          - cw-0001-wednesday
          - cw-0001-thursday
          - cw-0001-friday
          - cw-0001-saturday
          - cw-0001-sunday
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: court-week-audio-jobs
          path: .court-week-audio-jobs
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: site/narration-requirements.txt
      - name: Install prerecorded-media build dependencies
        run: |
          # Read only Ubuntu's runner source. Unrelated preconfigured vendor
          # feeds must not make this deterministic media job unavailable.
          ubuntu_sources=/etc/apt/sources.list.d/ubuntu.sources
          test -f "$ubuntu_sources"
          apt_options=(-o "Dir::Etc::sourcelist=$ubuntu_sources" -o "Dir::Etc::sourceparts=-")
          sudo apt-get "${apt_options[@]}" update
          sudo apt-get "${apt_options[@]}" install -y ffmpeg espeak-ng
          ffmpeg -version
          python -m pip install --disable-pip-version-check -r site/narration-requirements.txt
          python -c "import espeakng_loader; print(f'espeakng-loader ready: {espeakng_loader.__file__}')"
      - name: Synthesize, mix, normalize and validate one day
        env:
          HF_HUB_ENABLE_HF_TRANSFER: "1"
          TOKENIZERS_PARALLELISM: "false"
        run: >-
          python site/scripts/generate-court-week-audio.py
          ".court-week-audio-jobs/jobs/${{ matrix.session }}.json"
          .court-week-audio
      - uses: actions/upload-artifact@v4
        with:
          name: court-week-audio-${{ matrix.session }}
          path: .court-week-audio/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7

  package:
    needs: [source, audio]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: site/package-lock.json
      - name: Install the pinned strip builder
        working-directory: site
        run: npm ci
      - uses: actions/download-artifact@v4
        with:
          name: court-week-audio-jobs
          path: .court-week-audio-jobs
      - uses: actions/download-artifact@v4
        with:
          pattern: court-week-audio-cw-0001-*
          path: .court-week-audio
          merge-multiple: true
      - name: Build chronological two-scene art strips
        run: >-
          node site/scripts/scene-art-strips.mjs
          --requirements .court-week-audio-jobs/scene-art-requirements.json
          --media-root site/court-week-art/cw-0001
          --output-root .court-week-art-strips
      - name: Build content-addressed media and enforce hard budgets
        run: |
          set -euo pipefail
          arguments=(
            --release-tag "${{ inputs.release_tag }}"
            --audio-root .court-week-audio
            --jobs-root .court-week-audio-jobs
            --review-signoffs .court-week-audio-jobs/review-signoffs.json
            --art-requirements .court-week-audio-jobs/scene-art-requirements.json
            --art-root .court-week-art-strips
            --art-strips .court-week-art-strips/scene-art-strips.json
            --private-output-root .court-week-release-private
          )
          node site/scripts/prepare-court-week-release.mjs "${arguments[@]}"
      - name: Upload complete SceneArtManifest gap report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.release_tag }}-art-readiness
          path: .court-week-release-private/art-readiness-report.json
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 14
      - name: Upload private review manifests
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.release_tag }}-private-review
          path: .court-week-release-private/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7
      - name: Upload public Release payload
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.release_tag }}
          path: .court-week-release/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7

  publish:
    if: >-
      github.ref == 'refs/heads/main' &&
      github.event.repository.fork == false &&
      inputs.publish == true
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: site/app/package-lock.json
      - name: Install pinned signoff verifier
        working-directory: site/app
        run: npm ci
      - name: Require the reviewed run that produced the approved artifact
        env:
          REVIEWED_RUN_ID: ${{ inputs.reviewed_run_id }}
        run: |
          set -euo pipefail
          if [[ -z "${REVIEWED_RUN_ID}" ]]; then
            echo "publish=true requires reviewed_run_id pointing at the prior review workflow run." >&2
            exit 1
          fi
          if ! [[ "${REVIEWED_RUN_ID}" =~ ^[0-9]+$ ]]; then
            echo "reviewed_run_id must be a numeric GitHub Actions run id." >&2
            exit 1
          fi
      - name: Download the exact reviewed public Release payload
        id: reviewed
        env:
          GH_TOKEN: ${{ github.token }}
          REVIEWED_RUN_ID: ${{ inputs.reviewed_run_id }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          set -euo pipefail
          mkdir -p .court-week-release
          gh run download "$REVIEWED_RUN_ID" \
            --repo "$GITHUB_REPOSITORY" \
            --name "$RELEASE_TAG" \
            --dir .court-week-release
          test -f .court-week-release/release-manifest.json
          node -e '
            const fs = require("node:fs");
            const manifest = JSON.parse(fs.readFileSync(".court-week-release/release-manifest.json", "utf8"));
            if (manifest.release_tag !== process.env.RELEASE_TAG || manifest.case_id !== "cw-0001") {
              throw new Error("Reviewed artifact release-manifest does not match the requested tag");
            }
            if (!Number.isInteger(manifest.total_bytes) || manifest.total_bytes < (manifest.media_bytes ?? 0)) {
              throw new Error("Reviewed artifact is missing a complete total_bytes");
            }
            if (!/^sha256:[0-9a-f]{64}$/.test(manifest.review_content_digest) || !manifest.court_week_revision) {
              throw new Error("Reviewed artifact is missing its exact Court Week review identity");
            }
            const readiness = manifest.art_readiness;
            if (
              !Number.isInteger(readiness?.scene_count) ||
              readiness.scene_count <= 0 ||
              readiness?.release_ready !== true ||
              readiness.ready_scene_count !== readiness.scene_count ||
              readiness.gap_count !== 0
            ) {
              throw new Error(
                `Reviewed artifact is not release-ready: release_ready=${readiness?.release_ready ?? "missing"}, ` +
                `ready_scene_count=${readiness?.ready_scene_count ?? "missing"}, ` +
                `scene_count=${readiness?.scene_count ?? "missing"}, gap_count=${readiness?.gap_count ?? "missing"}`,
              );
            }
          '
          node -e '
            const fs = require("node:fs");
            const manifest = JSON.parse(fs.readFileSync(".court-week-release/release-manifest.json", "utf8"));
            fs.appendFileSync(process.env.GITHUB_OUTPUT, `digest=${manifest.review_content_digest}\nrevision=${manifest.court_week_revision}\n`);
          '
      - name: Require every exact-source review signoff
        working-directory: site/app
        run: >-
          npm run review:signoffs --
          --require-approved
          --expected-digest "${{ steps.reviewed.outputs.digest }}"
          --expected-revision "${{ steps.reviewed.outputs.revision }}"
      - name: Publish a new immutable release without mutating an existing tag
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag }}
          REVIEWED_RUN_ID: ${{ inputs.reviewed_run_id }}
        run: |
          set -euo pipefail
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $RELEASE_TAG already exists; immutable releases are never clobbered." >&2
            exit 1
          fi
          gh release create "$RELEASE_TAG" .court-week-release/* \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "SimJury Court Week media — $RELEASE_TAG" \
            --notes "Reviewed, content-addressed static media for cw-0001. Reviewed workflow run: $REVIEWED_RUN_ID. Publish commit: $GITHUB_SHA"
          test "$(gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json isImmutable --jq .isImmutable)" = true
