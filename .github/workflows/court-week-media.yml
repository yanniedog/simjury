name: court-week-media

# Trusted, explicit production path only. It never runs for pull requests,
# forks, schedules or content deletion, and it never clobbers an old release.
on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Immutable tag (court-week-cw-0001-YYYY.MM.DD-rN)
        required: true
        default: court-week-cw-0001-2026.08.03-r1
      publish:
        description: Publish after validation; false produces a review artifact only
        required: true
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: court-week-media-${{ inputs.release_tag }}
  cancel-in-progress: false

jobs:
  prepare:
    if: github.ref == 'refs/heads/main' && github.event.repository.fork == false
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: site/app/package-lock.json
      - name: Install pinned application dependencies
        working-directory: site/app
        run: npm ci
      - name: Validate the exact reviewed Court Week source
        working-directory: site/app
        run: npm run lint && npm run typecheck && npm test && npm run validate:cases && npm run build
      - name: Build content-addressed media and enforce release budgets
        run: node site/scripts/prepare-court-week-release.mjs --release-tag "${{ inputs.release_tag }}"
      - name: Upload private review artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.release_tag }}
          path: .court-week-release/
          if-no-files-found: error
          retention-days: 7
      - name: Publish a new release without mutating an existing tag
        if: inputs.publish == true
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          set -euo pipefail
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            echo "Release $RELEASE_TAG already exists; immutable releases are never clobbered." >&2
            exit 1
          fi
          gh release create "$RELEASE_TAG" .court-week-release/* \
            --target "$GITHUB_SHA" \
            --title "SimJury Court Week media — $RELEASE_TAG" \
            --notes "Reviewed, content-addressed static media for cw-0001. Source commit: $GITHUB_SHA"
