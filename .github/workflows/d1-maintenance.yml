name: d1-maintenance

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: d1-maintenance
  cancel-in-progress: false

jobs:
  migrate:
    name: waitlist-cost-migration
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Install
        working-directory: site
        run: npm ci
      - name: Drop the retired waitlist source index
        working-directory: site
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: >-
          npx wrangler d1 execute simjury-waitlist --remote
          --file=./schema/waitlist-v2-drop-source-index.sql
