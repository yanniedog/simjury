name: docket-supply

on:
  schedule:
    - cron: "10 18 * * *"
  workflow_dispatch:
  pull_request_review:
    types: [submitted]
  pull_request_review_comment:
    types: [created]

permissions:
  actions: write
  contents: write
  issues: write
  pull-requests: write

concurrency:
  # A review repair is isolated to its PR. Scheduled/manual commissioning stays
  # single-flight so two measurements cannot reserve the same newly open date.
  group: docket-supply-${{ github.event.pull_request.number || 'commission' }}
  cancel-in-progress: false

jobs:
  supply:
    if: >-
      github.event_name == 'schedule'
      || github.event_name == 'workflow_dispatch'
      || (
        (github.event_name == 'pull_request_review'
          || github.event_name == 'pull_request_review_comment')
        && github.event.pull_request.head.repo.full_name == github.repository
        && contains(github.event.pull_request.labels.*.name, 'docket-generation')
      )
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      CASE_GENERATION_ENABLED: "true"
      CASE_AGENT_ENDPOINT: gemini://generateContent
      CASE_AGENT_TOKEN: ${{ secrets.GEMINI_API_KEY }}
      CASE_AGENT_PROVIDER: google-gemini
      CASE_IMAGE_MODEL: gemini-3.1-flash-image
      CASE_IMAGE_LICENSE: Google Gemini API output terms
      CASE_DRAFT_MODEL: gemini-3.5-flash
      CASE_LEGAL_REVIEW_MODEL: gemini-2.5-pro
      CASE_STORY_REVIEW_MODEL: gemini-3.1-pro-preview
      CASE_MAX_ATTEMPTS: "2"
      CASE_MAX_REPAIR_ATTEMPTS: "2"
      CASE_MAX_IMAGES_PER_CASE: "24"
      CASE_MAX_OUTPUT_BYTES: "12000000"
      CASE_MAX_COST_USD: "8"
      CASE_MAX_TOKENS: "64000"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: site/app/package-lock.json
      - name: Install
        working-directory: site/app
        run: npm ci

      - name: Install and verify trusted media conversion
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          command -v ffmpeg

      - name: Measure the UTC rolling week
        id: plan
        working-directory: site/app
        run: |
          set -euo pipefail
          npx tsx scripts/docket-supply.ts --json > supply.json
          echo "needed=$(node -p "require('./supply.json').needed.length")" >> "$GITHUB_OUTPUT"
          echo "dates=$(node -p "require('./supply.json').needed.join(',')")" >> "$GITHUB_OUTPUT"
          cat supply.json >> "$GITHUB_STEP_SUMMARY"

      - name: Check kill switch, credentials, models and caps
        id: config
        run: |
          set +e
          node scripts/docket-case-agent.mjs config > config.json 2> config-error.txt
          result=$?
          set -e
          if jq -e '.missing | type == "array"' config.json >/dev/null 2>&1; then
            missing=$(node -e "const c=require('./config.json'); const m=[...c.missing]; if(!c.enabled)m.push('CASE_GENERATION_ENABLED'); process.stdout.write(m.join(','))")
            error=""
          else
            missing=INVALID_CASE_CONFIGURATION
            error=$(tr '\r\n,' '   ' < config-error.txt | head -c 500)
          fi
          if [ "$result" -eq 0 ] && [ -z "$missing" ]; then ready=true; else ready=false; fi
          echo "ready=$ready" >> "$GITHUB_OUTPUT"
          echo "missing=$missing" >> "$GITHUB_OUTPUT"
          echo "error=$error" >> "$GITHUB_OUTPUT"

      - name: Create or update the machine-readable supply record
        id: issue
        env:
          GH_TOKEN: ${{ github.token }}
          NEEDED: ${{ steps.plan.outputs.needed }}
          DATES: ${{ steps.plan.outputs.dates }}
          READY: ${{ steps.config.outputs.ready }}
          MISSING: ${{ steps.config.outputs.missing }}
          CONFIG_ERROR: ${{ steps.config.outputs.error }}
        run: |
          set -euo pipefail
          gh label create docket-supply --color B60205 --description "The docket is short of cases" 2>/dev/null || true
          existing=$(gh issue list --label docket-supply --state open --json number --jq '.[0].number // empty')
          if [ "$NEEDED" = 0 ]; then
            [ -z "$existing" ] || gh issue close "$existing" --comment "The rolling UTC week is fully covered."
            echo "number=" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          status=commissioned
          [ "$READY" = true ] || status=blocked_configuration
          json=$(jq -cn --arg status "$status" --arg dates "$DATES" --arg missing "$MISSING" --arg error "$CONFIG_ERROR" \
            '{schema:"simjury.docket-supply/v1",status:$status,dates:($dates|split(",")),missing_configuration:(if $missing=="" then [] else ($missing|split(",")) end),configuration_error:(if $error=="" then null else $error end)}')
          body=$(printf 'Automation owns complete cases for the named UTC dates.\n\n```json\n%s\n```\n\nNo partial case may merge; required CI and resolved bot feedback remain mandatory.' "$json")
          if [ -n "$existing" ]; then
            gh issue edit "$existing" --title "Docket supply: $NEEDED uncovered day(s)" --body "$body"
            number=$existing
          else
            url=$(gh issue create --title "Docket supply: $NEEDED uncovered day(s)" --body "$body" --label docket-supply)
            number=${url##*/}
          fi
          echo "number=$number" >> "$GITHUB_OUTPUT"

      - name: Reserve or resume one draft PR
        if: steps.plan.outputs.needed != '0' && steps.config.outputs.ready == 'true'
        id: pr
        env:
          GH_TOKEN: ${{ github.token }}
          DATES: ${{ steps.plan.outputs.dates }}
          EVENT_PR: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          git remote set-url origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          if [ -n "$EVENT_PR" ]; then
            active=$(gh pr view "$EVENT_PR" --json number,headRefName,baseRefName,isCrossRepository)
            test "$(jq -r .baseRefName <<<"$active")" = main
            test "$(jq -r .isCrossRepository <<<"$active")" = false
            number=$EVENT_PR
            branch=$(jq -r .headRefName <<<"$active")
            [[ "$branch" =~ ^automation/docket-[A-Za-z0-9._/-]+$ ]]
            git fetch origin "refs/heads/$branch:refs/remotes/origin/$branch"
            git checkout -B "$branch" "origin/$branch"
            fresh=false
          else
            states="$RUNNER_TEMP/active-docket-states.json"
            echo '[]' > "$states"
            gh pr list --state open --base main --label docket-generation \
              --json number,headRefName,headRefOid,isCrossRepository > "$RUNNER_TEMP/active-docket-prs.json"
            while read -r active; do
              [ "$(jq -r .isCrossRepository <<<"$active")" = false ] || continue
              pr=$(jq -r .number <<<"$active")
              active_branch=$(jq -r .headRefName <<<"$active")
              sha=$(jq -r .headRefOid <<<"$active")
              state=$(gh api "repos/$GITHUB_REPOSITORY/contents/.automation/docket-case-generation.json?ref=$sha" \
                --jq .content | base64 --decode)
              jq --argjson state "$state" --argjson pr "$pr" --arg branch "$active_branch" \
                '. + [$state + {pull_request:$pr,branch:$branch}]' "$states" > "$RUNNER_TEMP/states.next"
              mv "$RUNNER_TEMP/states.next" "$states"
            done < <(jq -c '.[]' "$RUNNER_TEMP/active-docket-prs.json")
            DATES=$(node scripts/docket-commission-plan.mjs --needed "$DATES" --states "$states")
            resume=$(node scripts/docket-commission-plan.mjs --resume --states "$states")
            if [ -n "$resume" ]; then
              number=$(jq -r .pull_request <<<"$resume")
              branch=$(jq -r .branch <<<"$resume")
              [[ "$branch" =~ ^automation/docket-[A-Za-z0-9._/-]+$ ]]
              git fetch origin "refs/heads/$branch:refs/remotes/origin/$branch"
              git checkout -B "$branch" "origin/$branch"
              fresh=false
            elif [ -z "$DATES" ]; then
              echo "number=" >> "$GITHUB_OUTPUT"
              echo "branch=" >> "$GITHUB_OUTPUT"
              echo "fresh=false" >> "$GITHUB_OUTPUT"
              echo "phase=idle" >> "$GITHUB_OUTPUT"
              echo "dates=" >> "$GITHUB_OUTPUT"
              exit 0
            else
              branch="automation/docket-${DATES%%,*}-${GITHUB_RUN_ID}"
              git checkout -b "$branch"
              mkdir -p .automation
              jq -n --arg dates "$DATES" '{schema:1,phase:"reserved",dates:($dates|split(",")),repair_attempts:0}' > .automation/docket-case-generation.json
              git config user.name "github-actions[bot]"
              git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
              git add .automation/docket-case-generation.json
              git commit -m "chore(docket): reserve automated case commission"
              git push -u origin "$branch"
              gh label create docket-generation --color 5319E7 --description "Autonomous case-generation PR" 2>/dev/null || true
              number=$(gh pr create --draft --base main --head "$branch" --title "feat(docket): commission ${DATES//,/, }" \
                --body "Role: Engineer (autonomous docket supply)\n\nReserved before final case hashes and generation metadata. Covers UTC dates: $DATES." --label docket-generation)
              number=${number##*/}
              jq --argjson pr "$number" '.draft_pr=$pr' .automation/docket-case-generation.json > state.json
              mv state.json .automation/docket-case-generation.json
              fresh=true
            fi
          fi
          echo "number=$number" >> "$GITHUB_OUTPUT"
          echo "branch=$branch" >> "$GITHUB_OUTPUT"
          echo "fresh=$fresh" >> "$GITHUB_OUTPUT"
          echo "phase=$(jq -r .phase .automation/docket-case-generation.json)" >> "$GITHUB_OUTPUT"
          echo "dates=$(jq -r '.dates|join(",")' .automation/docket-case-generation.json)" >> "$GITHUB_OUTPUT"

      - name: Draft, story-review, final legal review and write safe artifacts
        if: steps.pr.outputs.phase == 'reserved'
        env:
          GH_TOKEN: ${{ github.token }}
          DATES: ${{ steps.pr.outputs.dates }}
          PR: ${{ steps.pr.outputs.number }}
        run: |
          set -euo pipefail
          node scripts/docket-case-agent.mjs generate --dates "$DATES" --pr "$PR" --root "$GITHUB_WORKSPACE" > "$RUNNER_TEMP/generation-result.json"
          unsafe=$(git status --porcelain=v1 --untracked-files=all | awk '{print $2}' | grep -Ev '^(\.automation/docket-case-generation\.json|site/app/docket/dd-[0-9]{4}(\.json|/[^/]+\.json)|site/app/public/media/dd-[0-9]{4}/)' || true)
          test -z "$unsafe" || { echo "generated change escaped the allowlist: $unsafe" >&2; exit 1; }

      - name: Run the complete deterministic merge bar
        if: steps.pr.outputs.phase == 'reserved'
        working-directory: site/app
        run: npm run lint && npm run typecheck && npm test && npm run validate:cases && npm run build

      - name: Synthesize Kokoro narration
        if: steps.pr.outputs.phase == 'reserved'
        run: |
          set -euo pipefail
          ids=$(git status --porcelain=v1 --untracked-files=all | sed -nE 's#.*site/app/docket/(dd-[0-9]{4})(\.json|/.*)$#\1#p' | sort -u | paste -sd, -)
          test -n "$ids"
          bash site/scripts/synthesize-kokoro-clips.sh "$ids"

      - name: Publish validated Kokoro narration
        if: steps.pr.outputs.phase == 'reserved'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          node site/scripts/publish-kokoro-clips.mjs --clips narration-clips

      - name: Commit the complete sitting and request reviews
        if: steps.pr.outputs.phase == 'reserved'
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ steps.pr.outputs.number }}
          BRANCH: ${{ steps.pr.outputs.branch }}
        run: |
          set -euo pipefail
          git remote set-url origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          spent=$(jq .spent_usd "$RUNNER_TEMP/generation-result.json")
          jq --argjson spent "$spent" '.phase="awaiting_review"|.spent_usd=$spent' .automation/docket-case-generation.json > state.json
          mv state.json .automation/docket-case-generation.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .automation/docket-case-generation.json site/app/docket site/app/public/media
          git commit -m "feat(docket): add complete commissioned sittings"
          git push origin HEAD
          gh workflow run ci.yml --ref "$BRANCH"
          gh workflow run pr-bot-feedback-check.yml --ref "$BRANCH" -f pr_number="$PR"
          gh workflow run pr-request-bot-reviews.yml --ref "$BRANCH" -f pr_number="$PR"
          set +e
          npm run pr:arm-and-park -- --pr "$PR"
          result=$?
          set -e
          [ "$result" -eq 0 ] || [ "$result" -eq 2 ]
          node scripts/request-codex-review.mjs --pr "$PR" || true
          node scripts/request-coderabbit-review.mjs --pr "$PR" || true

      - name: Collect unresolved review threads for an existing case PR
        if: steps.pr.outputs.phase == 'awaiting_review'
        id: feedback
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ steps.pr.outputs.number }}
        run: |
          set -euo pipefail
          echo '{"threads":[]}' > feedback.json
          cursor=""
          while true; do
            args=(-F owner='${{ github.repository_owner }}' -F name='${{ github.event.repository.name }}' -F number="$PR")
            [ -z "$cursor" ] || args+=(-f after="$cursor")
            gh api graphql "${args[@]}" -f query='query($owner:String!,$name:String!,$number:Int!,$after:String){repository(owner:$owner,name:$name){pullRequest(number:$number){reviewThreads(first:100,after:$after){pageInfo{hasNextPage endCursor} nodes{id isResolved comments(first:20){nodes{body path line author{login}}}}}}}}' > threads.json
            jq -s '{threads:([.[0].threads[], (.[1].data.repository.pullRequest.reviewThreads.nodes[]|select(.isResolved==false)|{id,comments:.comments.nodes)])}' feedback.json threads.json > feedback.next
            mv feedback.next feedback.json
            [ "$(jq -r '.data.repository.pullRequest.reviewThreads.pageInfo.hasNextPage' threads.json)" = true ] || break
            cursor=$(jq -r '.data.repository.pullRequest.reviewThreads.pageInfo.endCursor' threads.json)
          done
          echo "count=$(jq '.threads|length' feedback.json)" >> "$GITHUB_OUTPUT"
          echo "attempt=$(jq '.repair_attempts+1' .automation/docket-case-generation.json)" >> "$GITHUB_OUTPUT"

      - name: Repair and validate every actionable review thread within the cap
        if: steps.pr.outputs.phase == 'awaiting_review' && steps.feedback.outputs.count != '0'
        env:
          DATES: ${{ steps.pr.outputs.dates }}
          PR: ${{ steps.pr.outputs.number }}
          ATTEMPT: ${{ steps.feedback.outputs.attempt }}
        run: |
          set -euo pipefail
          node scripts/docket-case-agent.mjs repair --dates "$DATES" --pr "$PR" --root "$GITHUB_WORKSPACE" \
            --feedback feedback.json --repair-attempt "$ATTEMPT" \
            --spent-usd "$(jq -r '.spent_usd // 0' .automation/docket-case-generation.json)" > "$RUNNER_TEMP/repair-result.json"
          npm --prefix site/app run lint
          npm --prefix site/app run typecheck
          npm --prefix site/app test
          npm --prefix site/app run validate:cases
          npm --prefix site/app run build

      - name: Synthesize repaired Kokoro narration
        if: steps.pr.outputs.phase == 'awaiting_review' && steps.feedback.outputs.count != '0'
        id: repair-narration
        run: |
          set -euo pipefail
          ids=$(git status --porcelain=v1 --untracked-files=all | sed -nE 's#.*site/app/docket/(dd-[0-9]{4})(\.json|/.*)$#\1#p' | sort -u | paste -sd, -)
          if [ -z "$ids" ]; then echo "needed=false" >> "$GITHUB_OUTPUT"; exit 0; fi
          echo "needed=true" >> "$GITHUB_OUTPUT"
          bash site/scripts/synthesize-kokoro-clips.sh "$ids"

      - name: Publish narration and commit the validated repair
        if: steps.pr.outputs.phase == 'awaiting_review' && steps.feedback.outputs.count != '0'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PR: ${{ steps.pr.outputs.number }}
          ATTEMPT: ${{ steps.feedback.outputs.attempt }}
          NARRATION_NEEDED: ${{ steps.repair-narration.outputs.needed }}
          BRANCH: ${{ steps.pr.outputs.branch }}
        run: |
          set -euo pipefail
          [ "$NARRATION_NEEDED" != true ] || node site/scripts/publish-kokoro-clips.mjs --clips narration-clips
          spent=$(jq .spent_usd "$RUNNER_TEMP/repair-result.json")
          jq --argjson n "$ATTEMPT" --argjson spent "$spent" '.repair_attempts=$n|.spent_usd=$spent' .automation/docket-case-generation.json > state.json
          mv state.json .automation/docket-case-generation.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote set-url origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git add .automation/docket-case-generation.json site/app/docket site/app/public/media
          git commit -m "fix(docket): address automated review feedback"
          git push origin HEAD
          gh workflow run ci.yml --ref "$BRANCH"
          gh workflow run pr-bot-feedback-check.yml --ref "$BRANCH" -f pr_number="$PR"
          gh workflow run pr-request-bot-reviews.yml --ref "$BRANCH" -f pr_number="$PR"
          jq -c '.dispositions[]' "$RUNNER_TEMP/repair-result.json" | while read -r item; do
            id=$(jq -r .thread_id <<<"$item")
            status=$(jq -r .status <<<"$item")
            body=$(jq -r '(.status + ": " + .reason)' <<<"$item")
            gh api graphql -F id="$id" -F body="$body" -f query='mutation($id:ID!,$body:String!){addPullRequestReviewThreadReply(input:{pullRequestReviewThreadId:$id,body:$body}){comment{id}}}'
            [ "$status" = Deferred ] || gh api graphql -F id="$id" -f query='mutation($id:ID!){resolveReviewThread(input:{threadId:$id}){thread{id isResolved}}}'
          done
          set +e
          npm run pr:arm-and-park -- --pr "$PR"
          result=$?
          set -e
          [ "$result" -eq 0 ] || [ "$result" -eq 2 ]

      - name: Record a fail-closed automation blocker
        if: failure() && steps.issue.outputs.number != ''
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE: ${{ steps.issue.outputs.number }}
          DATES: ${{ steps.plan.outputs.dates }}
        run: |
          json=$(jq -cn --arg dates "$DATES" --arg run "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" \
            '{schema:"simjury.docket-supply/v1",status:"blocked_automation",dates:($dates|split(",")),run:$run}')
          gh issue comment "$ISSUE" --body "\`\`\`json
          $json
          \`\`\`
          Automation stopped without weakening any gate or publishing a partial case."
