name: "Automated Gemini Code Review"
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read
  pull-requests: write

jobs:
  review:
    # Fork PRs do not receive GEMINI_API_KEY / write tokens on pull_request.
    # Skip drafts so free-tier quota is spent on ready PRs only (draft-first flow).
    if: >
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    # Gemini free-tier 429s must not block merge; advisory review only.
    continue-on-error: true
    steps:
      - name: "Checkout Repo"
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: "Run AI Code Review"
        # Pin v2 tag (ecc2434…) so the secret-backed action cannot drift via a mutable tag.
        uses: sshnaidm/gemini-code-review-action@ecc2434351ef76b0084b788a3d61ec7d3acf44f9 # v2
        with:
          gemini-key: ${{ secrets.GEMINI_API_KEY }}
          model: "gemini-flash-latest"
          review-title: |
            <!-- gemini-code-review -->
            # Code Review by Gemini
          prompt: |
            You are reviewing a SimJury Court Week PR (static React site + pre-authored fictional trial record).
            Flag real defects only: broken player flows, data loss, security issues, CI/gate breakages,
            and fiction-safety (real names of people/companies/brands/places in player-visible text).
            Prefer TypeScript/React and site/app concerns over style or optional refactors.
            For Court Week content: flag legal-order violations, fiction-integrity issues,
            spoilers before verdict return, and material contradictions that would confuse jurors.
            For .github/workflows: flag permission mistakes and merge-protection gaps.
            Ignore pure formatting, renames, and speculative nits.
