name: natural-narration

on:
  workflow_dispatch:
    inputs:
      case_id:
        description: "Docket id, comma-separated ids, or all"
        required: true
        default: "dd-0001"
      force_voicebank:
        description: "Rebuild the VoiceDesign reference bank"
        type: boolean
        default: false
  push:
    branches: [main]
    paths:
      - "site/app/docket/*.json"
      - "site/app/src/lib/narration.ts"
      - "site/app/src/lib/narratorCues.ts"
      - "site/app/src/lib/narratorCueCopy.json"
      - "site/app/src/lib/castGenders.json"
      - "site/app/src/lib/speakerVoices.ts"
      - "site/app/src/lib/narrationVoices.json"
      - "site/narration-requirements.txt"
      - "site/scripts/build-kokoro-jobs.mjs"
      - "site/scripts/speaker-voices.mjs"
      - "site/scripts/ensure-narration-voicebank.py"
      - "site/scripts/generate-kokoro-clips.py"
      - "site/scripts/qwen_tts_load.py"
      - "site/scripts/publish-kokoro-clips.mjs"
      - ".github/workflows/natural-narration.yml"

permissions:
  actions: read
  contents: write

concurrency:
  group: natural-narration
  cancel-in-progress: false

env:
  # Single Hub root only — dual TRANSFORMERS_CACHE paths produced incomplete
  # speech_tokenizer snapshots that Actions then re-cached forever.
  HF_HOME: ${{ github.workspace }}/.hf-cache
  HF_HUB_ENABLE_HF_TRANSFER: "1"

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      cases: ${{ steps.cases.outputs.value }}
      clobber_mp3s: ${{ steps.cases.outputs.clobber_mp3s }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - id: cases
        shell: bash
        env:
          REQUESTED_CASES: ${{ inputs.case_id }}
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            requested="$REQUESTED_CASES"
          else
            changed="$(git diff --name-only HEAD^ HEAD)"
            # Synthesis inputs / spoken cue copy / voice bank force all.
            if grep -Eq '^(site/app/src/lib/(narration|narratorCues|castGenders|speakerVoices|narrationVoices)\.(ts|json)|site/app/src/lib/narratorCueCopy\.json|site/narration-requirements\.txt|site/scripts/(generate-kokoro-clips\.py|ensure-narration-voicebank\.py|qwen_tts_load\.py|speaker-voices\.mjs))$' <<< "$changed"; then
              requested="all"
            else
              requested="$(sed -nE 's#^site/app/docket/(dd-[0-9]{4}|dd-intro)\.json$#\1#p' <<< "$changed" |
                sort -u | paste -sd, -)"
            fi
          fi
          clobber="false"
          if [[ "$requested" == "all" && "${{ github.event_name }}" != "workflow_dispatch" ]]; then
            clobber="true"
          fi
          if [[ -z "$requested" ]]; then
            echo "No narration corpus changes; skipping generation."
            echo "value=[]" >> "$GITHUB_OUTPUT"
            echo "clobber_mp3s=false" >> "$GITHUB_OUTPUT"
          else
            echo "value=$(node site/scripts/build-kokoro-jobs.mjs --case "$requested" --list)" >> "$GITHUB_OUTPUT"
            echo "clobber_mp3s=$clobber" >> "$GITHUB_OUTPUT"
          fi
      - name: Create stable GitHub voice-pack releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "narration-voicebank" >/dev/null 2>&1 ||
            gh release create "narration-voicebank" --title "Qwen3-TTS VoiceDesign bank" \
              --notes "Apache-2.0 Qwen3-TTS VoiceDesign reference clips for SimJury narration."
          for shard in $(seq 0 31); do
            tag="narration-qwen-$shard"
            gh release view "$tag" >/dev/null 2>&1 ||
              gh release create "$tag" --title "Qwen3-TTS natural narration — shard $shard" \
                --notes "Apache-2.0 Qwen3-TTS speech generated from GitHub-authored SimJury cases."
          done

  voicebank:
    needs: prepare
    if: needs.prepare.outputs.cases != '[]'
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: site/narration-requirements.txt
      - uses: actions/cache@v4
        with:
          path: .hf-cache
          key: qwen3-tts-hf-v2-${{ hashFiles('site/narration-requirements.txt') }}
          restore-keys: |
            qwen3-tts-hf-v2-
      - name: Install open-source speech tooling
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg sox libsox-fmt-all
          python -m pip install --upgrade pip
          pip install -r site/narration-requirements.txt
      - name: Restore published voicebank when present
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p narration-voicebank
          if [[ "${{ github.event_name }}" == "workflow_dispatch" && "${{ inputs.force_voicebank }}" == "true" ]]; then
            echo "Forcing VoiceDesign rebuild"
            exit 0
          fi
          assets="$(gh release view narration-voicebank --json assets --jq '.assets[].name' || true)"
          if [[ -z "$assets" ]]; then
            echo "No published voicebank yet"
            exit 0
          fi
          while IFS= read -r name; do
            [[ -n "$name" ]] || continue
            gh release download narration-voicebank --pattern "$name" --dir narration-voicebank
          done <<< "$assets"
      - name: Design any missing gendered reference voices
        env:
          FORCE_VOICEBANK: ${{ github.event_name == 'workflow_dispatch' && inputs.force_voicebank || false }}
        run: |
          extra=()
          if [[ "$FORCE_VOICEBANK" == "true" ]]; then
            extra+=(--force)
          fi
          python site/scripts/ensure-narration-voicebank.py \
            --voices site/app/src/lib/narrationVoices.json \
            --output narration-voicebank \
            "${extra[@]}"
      - name: Publish voicebank
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          shopt -s nullglob
          files=(narration-voicebank/*.{wav,json})
          test ${#files[@]} -gt 0
          gh release upload narration-voicebank "${files[@]}" --clobber
      - uses: actions/upload-artifact@v4
        with:
          name: qwen-voicebank
          path: narration-voicebank/
          retention-days: 3

  generate:
    needs: [prepare, voicebank]
    if: needs.prepare.outputs.cases != '[]'
    runs-on: ubuntu-latest
    timeout-minutes: 360
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        case_id: ${{ fromJSON(needs.prepare.outputs.cases) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: site/narration-requirements.txt
      - uses: actions/cache@v4
        with:
          path: .hf-cache
          key: qwen3-tts-hf-v2-${{ hashFiles('site/narration-requirements.txt') }}
          restore-keys: |
            qwen3-tts-hf-v2-
      - name: Install open-source speech tooling
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg sox libsox-fmt-all
          python -m pip install --upgrade pip
          pip install -r site/narration-requirements.txt
      - name: Fetch VoiceDesign reference bank
        uses: actions/download-artifact@v4
        with:
          name: qwen-voicebank
          path: narration-voicebank
      - name: Generate this case
        run: |
          node site/scripts/build-kokoro-jobs.mjs \
            --case "${{ matrix.case_id }}" --output .narration-jobs
          python site/scripts/generate-kokoro-clips.py \
            ".narration-jobs/${{ matrix.case_id }}.json" narration-clips \
            --voicebank narration-voicebank
      - name: Stage clips for one rate-limited publication job
        uses: actions/upload-artifact@v4
        with:
          name: narration-${{ matrix.case_id }}
          path: narration-clips/
          retention-days: 1

  publish:
    needs: [prepare, generate]
    if: needs.prepare.outputs.cases != '[]'
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Collect generated case packs
        uses: actions/download-artifact@v4
        with:
          pattern: narration-*
          path: narration-clips
          merge-multiple: true
      - name: Publish shard zips + missing MP3s only
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          CLOBBER_MP3S: ${{ needs.prepare.outputs.clobber_mp3s }}
        run: |
          extra=""
          if [[ "$CLOBBER_MP3S" == "true" ]]; then
            extra="--clobber-mp3s"
          fi
          node site/scripts/publish-kokoro-clips.mjs --clips narration-clips $extra
