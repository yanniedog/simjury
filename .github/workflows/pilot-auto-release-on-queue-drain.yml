# Auto pilot APK release when the last open PR to main is squash-merged.
# Bumps versionName in pilot/app/build.gradle.kts and dispatches pilot-android-apk.
# Parity with AR-local mobile-auto-release-on-queue-drain.yml
#
# ANDROID FROZEN (2026-07-27) until further notice — see AGENTS.md / DAILY-PIVOT.md.
# This workflow no longer bumps or dispatches APK builds while the freeze holds.

name: pilot-auto-release-on-queue-drain

on:
  workflow_dispatch:
  pull_request:
    types: [closed]
    branches: [main]

permissions:
  contents: write
  pull-requests: write
  actions: write

concurrency:
  group: pilot-auto-release-on-drain
  cancel-in-progress: false

jobs:
  maybe-release:
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.merged == true
    name: bump pilot version when queue drained
    runs-on: ubuntu-latest
    steps:
      - name: Android / JVM pilot frozen
        run: |
          echo "Skipping pilot auto-release — Android is frozen until further notice."
          echo "See AGENTS.md, CLAUDE.md, and DAILY-PIVOT.md decision #5."
