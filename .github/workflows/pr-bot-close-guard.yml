name: pr-bot-close-guard

# Prevent premature PR closure while merge-protection bot obligations remain.
# Reopens closed-but-unmerged PRs that still need CodeRabbit/peer presence or
# unresolved review-thread resolution. Squash merge stays blocked by required
# checks (bot-presence-gate, bot-feedback-gate) on main.
on:
  pull_request:
    types: [closed]
  workflow_dispatch:
    inputs:
      pr_number:
        description: Pull request number
        required: true
        type: string
      reopen:
        description: Reopen when blocked
        required: false
        type: boolean
        default: true

permissions:
  contents: read
  pull-requests: write
  issues: write

concurrency:
  group: bot-close-guard-${{ github.event.pull_request.number || inputs.pr_number || github.run_id }}
  cancel-in-progress: false

jobs:
  bot-close-guard:
    if: >-
      github.event_name == 'workflow_dispatch'
      || (github.event.pull_request != null && github.event.pull_request.merged == false)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Guard premature close
        env:
          GH_TOKEN: ${{ secrets.BOT_GATE_TOKEN || github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          SIMJURY_BOT_WAIT_REQUIRED: sourcery|codex|cursor,coderabbit
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            PR="${{ inputs.pr_number }}"
            REOPEN_FLAG=""
            if [ "${{ inputs.reopen }}" = "true" ]; then
              REOPEN_FLAG="--reopen"
            fi
          else
            PR="${{ github.event.pull_request.number }}"
            REOPEN_FLAG="--reopen"
          fi
          if [ -z "$PR" ] || [ "$PR" = "null" ]; then
            echo "No PR associated with this event; skip."
            exit 0
          fi
          set +e
          npm run pr:bot-close-guard -- --pr "$PR" $REOPEN_FLAG
          code=$?
          set -e
          # Exit 1 = blocked and reopened successfully — treat as workflow success
          # (the protection side-effect already ran).
          # Exit 3 = reopen failed / hard error — must fail the check.
          if [ "$code" -eq 1 ]; then
            echo "Close blocked / PR reopened under bot merge protection."
            exit 0
          fi
          if [ "$code" -eq 2 ]; then
            echo "::warning::GitHub API rate limit — re-run close guard after quota resets"
            exit 1
          fi
          if [ "$code" -eq 3 ]; then
            echo "::error::Close guard hard error (e.g. reopen failed) — PR may still be closed"
            exit 1
          fi
          exit "$code"
