name: pr-bot-feedback-check

# Required thread-closure gate. Each event evaluates once, with only a short
# bounded retry to cover the reply-before-resolution race.
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  pull_request_review:
    types: [submitted]
  pull_request_review_comment:
    types: [created, edited, deleted]
  workflow_dispatch:
    inputs:
      pr_number:
        description: Pull request number
        required: true
        type: string

permissions:
  contents: read
  pull-requests: read

jobs:
  bot-feedback-gate:
    if: >-
      github.event.pull_request != null
      || github.event.review != null
      || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # Execute protected base policy, never JavaScript supplied by the PR.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.pull_request.base.sha || github.event.repository.default_branch }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "24"
      - name: Skip thread gate for exempt PRs
        id: gate_exempt
        env:
          GH_TOKEN: ${{ secrets.BOT_GATE_TOKEN || github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            PR="${{ inputs.pr_number }}"
          else
            PR="${{ github.event.pull_request.number }}"
          fi
          [[ "$PR" =~ ^[0-9]+$ ]] || { echo "::error::Pull request number must be numeric"; exit 1; }
          if ! PR_STATE=$(gh api "repos/$GITHUB_REPOSITORY/pulls/$PR" --jq .state); then
            echo "::error::GitHub API could not read PR state; retry this check."
            exit 2
          fi
          if [ "$PR_STATE" != "open" ]; then
            echo "gate_exempt=true" >> "$GITHUB_OUTPUT"
            echo "gate_exempt_reason=pull-request-$PR_STATE" >> "$GITHUB_OUTPUT"
            echo "PR #$PR is $PR_STATE - stale event skipped"
            exit 0
          fi
          export PR
          EXEMPT=$(node scripts/pr-gate-exempt-reason.mjs || true)
          if [ -n "$EXEMPT" ]; then
            echo "gate_exempt=true" >> "$GITHUB_OUTPUT"
            echo "gate_exempt_reason=$EXEMPT" >> "$GITHUB_OUTPUT"
          else
            echo "gate_exempt=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Gate exempt - pass
        if: steps.gate_exempt.outputs.gate_exempt == 'true'
        run: echo "bot-feedback-gate skipped (${{ steps.gate_exempt.outputs.gate_exempt_reason }})"
      - name: Review thread closure gate
        if: steps.gate_exempt.outputs.gate_exempt != 'true'
        env:
          GH_TOKEN: ${{ secrets.BOT_GATE_TOKEN || github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            PR="${{ inputs.pr_number }}"
          else
            PR="${{ github.event.pull_request.number }}"
          fi
          [[ "$PR" =~ ^[0-9]+$ ]] || { echo "::error::Pull request number must be numeric"; exit 1; }
          code=1
          for attempt in 1 2 3 4; do
            set +e
            npm run pr:bot-feedback-check -- --pr "$PR" --skip-bot-presence
            code=$?
            set -e
            if [ "$code" -eq 0 ]; then
              exit 0
            fi
            if [ "$code" -ne 1 ] || [ "$attempt" -eq 4 ]; then
              break
            fi
            echo "Feedback still open; retrying shortly in case a reply-triggered run preceded thread resolution."
            sleep 5
          done
          if [ "$code" -eq 2 ]; then
            echo "::error::GitHub API rate limit prevented the feedback audit; rerun this check."
          else
            echo "::error::Substantive review feedback remains open. Reply and resolve it; the reply event will re-run this gate."
          fi
          exit "$code"
