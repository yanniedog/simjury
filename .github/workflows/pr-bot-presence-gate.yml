name: pr-bot-presence-gate

# Disabled advisory diagnostic. Reviewer presence is never required for merge.
on:
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write
  issues: write
  statuses: read

concurrency:
  group: bot-presence-gate-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  bot-presence-gate:
    if: ${{ false }}
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Patch base GraphQL CodeRabbit comment to REST (hermetic)
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('fs');
          const path = 'scripts/coderabbit-contract.mjs';
          let src = fs.readFileSync(path, 'utf8');
          if (!src.includes("['pr', 'comment'")) {
            console.log('Base contract already avoids GraphQL pr comment');
            process.exit(0);
          }
          const needle = [
            "  const r = spawnSync('gh', ['pr', 'comment', String(pr), '--body', body], {",
            "    encoding: 'utf8',",
            "  });",
            "  if (r.status !== 0) throw new Error((r.stderr || r.stdout || 'comment failed').trim());",
            "  console.log(`coderabbit-contract: requested full review on #${pr} (${reason})`);",
          ].join('\n');
          const replacement = [
            "  const repo = String(process.env.GITHUB_REPOSITORY || '').trim();",
            "  if (!repo.includes('/')) throw new Error('GITHUB_REPOSITORY required for REST comment');",
            "  const r = spawnSync(",
            "    'gh',",
            '    [\'api\', `repos/${repo}/issues/${pr}/comments`, \'-f\', `body=${body}`],',
            "    { encoding: 'utf8' },",
            "  );",
            "  if (r.status !== 0) {",
            "    console.warn(",
            '      `coderabbit-contract: comment failed (${(r.stderr || r.stdout || \'comment failed\').trim()}); waiting for status`,',
            "    );",
            "    return;",
            "  }",
            '  console.log(`coderabbit-contract: requested full review on #${pr} (${reason})`);',
          ].join('\n');
          if (!src.includes(needle)) {
            console.error('Expected GraphQL postReview block not found; refusing to guess');
            process.exit(1);
          }
          fs.writeFileSync(path, src.replace(needle, replacement));
          console.log('Patched base postReview to REST issue comments (soft-fail)');
          NODE
      - name: Require exact-head CodeRabbit completion
        env:
          GH_TOKEN: ${{ secrets.BOT_GATE_TOKEN || github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: >-
          npm run pr:coderabbit-contract --
          --pr "${{ github.event.pull_request.number }}"
          --watch --timeout-min 220
      - name: Require a current peer bot
        env:
          GH_TOKEN: ${{ secrets.BOT_GATE_TOKEN || github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          BOT_WAIT_IGNORE_CHECK_NAMES: bot-presence-gate,bot-feedback-gate
          BOT_WAIT_MAX_MIN: "220"
        run: >-
          npm run wait-for-bots --
          --pr "${{ github.event.pull_request.number }}"
          --since "${{ github.event.pull_request.updated_at }}"
          --require-bots "sourcery|codex|cursor"
          --watch
