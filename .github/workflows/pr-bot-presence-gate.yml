name: pr-bot-presence-gate

# One trusted, head-scoped controller. It requests exactly one CodeRabbit full
# review per head, waits through vendor quota, and accepts only CodeRabbit's
# "Review completed" commit status on that exact SHA.
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, converted_to_draft]

permissions:
  contents: read
  # GitHub returned HTTP 403 for PR issue comments with issues:write alone.
  # This job executes base-SHA policy and uses write only to post review triggers;
  # the contract has no merge/update API path.
  pull-requests: write
  issues: write

concurrency:
  group: bot-presence-gate-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  bot-presence-gate:
    if: github.event.pull_request.draft == false && github.event.action != 'converted_to_draft'
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      # Execute trusted policy from the base SHA, never PR-controlled scripts.
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      # Base still posts via `gh pr comment` (GraphQL addComment → 403). Overlay the
      # PR's REST contract script until that fix is on main; only this one file.
      - name: Overlay REST CodeRabbit contract when base still uses GraphQL
        if: github.event.pull_request.head.repo.full_name == github.repository
        run: |
          set -euo pipefail
          if grep -F "['pr', 'comment'" scripts/coderabbit-contract.mjs >/dev/null; then
            echo "Base contract uses GraphQL pr comment — overlaying REST script from PR head"
            git fetch --depth=1 origin "${{ github.event.pull_request.head.sha }}"
            git checkout "${{ github.event.pull_request.head.sha }}" -- scripts/coderabbit-contract.mjs
          else
            echo "Base contract already uses REST issue comments"
          fi
      - name: Require exact-head CodeRabbit completion
        env:
          GH_TOKEN: ${{ secrets.BOT_GATE_TOKEN || github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: >-
          npm run pr:coderabbit-contract --
          --pr "${{ github.event.pull_request.number }}"
          --watch --timeout-min 220
      - name: Require a current peer bot
        env:
          GH_TOKEN: ${{ secrets.BOT_GATE_TOKEN || github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          BOT_WAIT_IGNORE_CHECK_NAMES: bot-presence-gate,bot-feedback-gate
          BOT_WAIT_MAX_MIN: "220"
        run: >-
          npm run wait-for-bots --
          --pr "${{ github.event.pull_request.number }}"
          --since "${{ github.event.pull_request.updated_at }}"
          --require-bots "sourcery|codex|cursor"
          --watch
