name: pr-coderabbit-ensure-review

# Durable CodeRabbit ensure: no long sleeps (those get cancelled).
# Every 15 minutes + on demand:
#   - OPEN PRs: when rate-limit wait elapsed / ack-only / missing proper review → @coderabbitai full review
#   - CLOSED: reopen + request
#   - MERGED: request on merged PR
# Stops only after a *proper* CR review (not rate-limit or command ack).
on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:
    inputs:
      pr_number:
        description: "Optional single PR number"
        required: false
        type: string
      lookback_days:
        description: "Days of closed/merged history to scan"
        required: false
        type: string
        default: "14"
      dry_run:
        description: "Dry run"
        required: false
        type: boolean
        default: false
      open_only:
        description: "Only scan open PRs"
        required: false
        type: boolean
        default: false

permissions:
  contents: read
  pull-requests: write
  issues: write

concurrency:
  group: pr-coderabbit-ensure-review
  cancel-in-progress: false

jobs:
  ensure-coderabbit-review:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Ensure proper CodeRabbit reviews
        env:
          GH_TOKEN: ${{ secrets.BOT_GATE_TOKEN || github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          CR_RECOVERY_LOOKBACK_DAYS: ${{ inputs.lookback_days || '14' }}
          CR_ENSURE_PR_NUMBER: ${{ inputs.pr_number }}
          CR_ENSURE_DRY_RUN: ${{ inputs.dry_run }}
          CR_ENSURE_OPEN_ONLY: ${{ inputs.open_only }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail
          ARGS=(--lookback-days "${CR_RECOVERY_LOOKBACK_DAYS}")
          if [ "$EVENT_NAME" = "workflow_dispatch" ] && [ -n "${CR_ENSURE_PR_NUMBER:-}" ]; then
            ARGS+=(--pr "${CR_ENSURE_PR_NUMBER}")
          fi
          if [ "${CR_ENSURE_DRY_RUN:-false}" = "true" ]; then
            ARGS+=(--dry-run)
          fi
          if [ "${CR_ENSURE_OPEN_ONLY:-false}" = "true" ]; then
            ARGS+=(--open-only)
          fi
          npm run pr:coderabbit-ensure-review -- "${ARGS[@]}"
