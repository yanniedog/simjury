name: pr-coderabbit-ensure-review

# Legacy diagnostic only. Scheduled fan-out was removed because it repeatedly
# re-reviewed clean/merged PRs and exhausted CodeRabbit quota. The exact-head
# bot-presence contract now owns all automatic requests.
on:
  workflow_dispatch:
    inputs:
      pr_number:
        description: "Single open PR number"
        required: true
        type: string
      dry_run:
        description: "Dry run"
        required: false
        type: boolean
        default: false

permissions:
  contents: read
  pull-requests: write
  issues: write

concurrency:
  group: pr-coderabbit-ensure-review
  cancel-in-progress: false

jobs:
  ensure-coderabbit-review:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Ensure proper CodeRabbit reviews
        env:
          GH_TOKEN: ${{ secrets.BOT_GATE_TOKEN || github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          CR_ENSURE_PR_NUMBER: ${{ inputs.pr_number }}
          CR_ENSURE_DRY_RUN: ${{ inputs.dry_run }}
        run: |
          set -euo pipefail
          ARGS=(--pr "${CR_ENSURE_PR_NUMBER}" --open-only)
          if [ "${CR_ENSURE_DRY_RUN:-false}" = "true" ]; then
            ARGS+=(--dry-run)
          fi
          npm run pr:coderabbit-ensure-review -- "${ARGS[@]}"
