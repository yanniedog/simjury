name: pr-coderabbit-review-recovery

# Hourly: reopen closed PRs (and open recovery PRs for merged ones) where
# CodeRabbit only left a rate-limit notice / failed review / no substantive review.
# Requests @coderabbitai review at most once per hour until a proper CR review lands.
on:
  schedule:
    - cron: "7 * * * *"
  workflow_dispatch:
    inputs:
      pr_number:
        description: "Optional single PR number (default: scan lookback window)"
        required: false
        type: string
      lookback_days:
        description: "Days of closed/merged history to scan"
        required: false
        type: string
        default: "14"
      dry_run:
        description: "Dry run (no reopen / no comments)"
        required: false
        type: boolean
        default: false

permissions:
  contents: read
  pull-requests: write
  issues: write

concurrency:
  group: pr-coderabbit-review-recovery
  cancel-in-progress: false

jobs:
  coderabbit-review-recovery:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Recover closed/merged PRs missing substantive CodeRabbit review
        env:
          GH_TOKEN: ${{ secrets.BOT_GATE_TOKEN || github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          CR_RECOVERY_LOOKBACK_DAYS: ${{ inputs.lookback_days || '14' }}
        run: |
          set -euo pipefail
          ARGS=(--lookback-days "${CR_RECOVERY_LOOKBACK_DAYS}")
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ -n "${{ inputs.pr_number }}" ]; then
            ARGS+=(--pr "${{ inputs.pr_number }}")
          fi
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            ARGS+=(--dry-run)
          fi
          npm run pr:coderabbit-review-recovery -- "${ARGS[@]}"
