name: pr-local-llm-review

# Disabled advisory diagnostic. Laptop or Ollama availability never blocks merge.
on:
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: local-llm-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  preflight:
    if: ${{ false }}
    name: local-llm-preflight
    runs-on: ubuntu-latest
    steps:
      - name: Reject untrusted fork execution
        shell: bash
        env:
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          BASE_REPO: ${{ github.repository }}
          BASE_REF: ${{ github.event.pull_request.base.ref }}
        run: |
          set -euo pipefail
          test "$BASE_REF" = main
          test "$HEAD_REPO" = "$BASE_REPO" || {
            echo "Fork PRs cannot run on the private laptop reviewer."
            exit 1
          }

  qwen:
    if: ${{ false }}
    name: local-qwen-review
    needs: preflight
    runs-on: [self-hosted, Windows, X64, simjury-local-llm]
    timeout-minutes: 45
    steps:
      - name: Check out trusted base revision only
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          persist-credentials: false
          clean: true

      - name: Review inert PR patch with local Qwen
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        shell: powershell
        run: |
          Get-Process ollama -ErrorAction SilentlyContinue |
            ForEach-Object { $_.PriorityClass = 'BelowNormal' }
          node scripts/local-llm-pr-gate.mjs --pr "$env:PR_NUMBER" --repo "$env:GITHUB_REPOSITORY" --head "$env:PR_HEAD_SHA" --base "$env:PR_BASE_SHA"

  local-llm-review:
    if: ${{ false }}
    name: local-llm-review
    needs: [preflight, qwen]
    runs-on: ubuntu-latest
    steps:
      - run: echo "Local Qwen review is advisory and disabled."
