name: pr-request-bot-reviews

# Reviewers are advisory. This workflow nudges Codex without creating a required
# presence dependency or consuming CodeRabbit quota.
on:
  pull_request:
    types: [opened, synchronize, ready_for_review]
  workflow_dispatch:
    inputs:
      pr_number:
        description: Pull request number
        required: true
        type: string

permissions:
  contents: read
  pull-requests: write
  issues: write

concurrency:
  group: pr-request-bot-reviews-${{ github.event.pull_request.number || inputs.pr_number || github.run_id }}
  cancel-in-progress: false

jobs:
  request-bot-reviews:
    if: >-
      github.event_name == 'workflow_dispatch'
      || (github.event.pull_request != null && github.event.pull_request.draft == false)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.sha || 'main' }}
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Resolve PR
        id: pr
        env:
          GH_TOKEN: ${{ secrets.BOT_GATE_TOKEN || github.token }}
        run: |
          case "${{ github.event_name }}" in
            workflow_dispatch) PR="${{ inputs.pr_number }}" ;;
            *)                 PR="${{ github.event.pull_request.number }}" ;;
          esac
          if [ -z "$PR" ] || [ "$PR" = "null" ]; then
            exit 1
          fi
          echo "number=$PR" >> "$GITHUB_OUTPUT"
      - name: Request Codex review
        env:
          GH_TOKEN: ${{ secrets.BOT_GATE_TOKEN || github.token }}
        run: |
          PR="${{ steps.pr.outputs.number }}"
          node scripts/request-codex-review.mjs --pr "$PR"
