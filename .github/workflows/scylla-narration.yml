# Experimental alternate voice mode (Scylla's Band). Removable:
# delete this workflow, site/scripts/*scylla*, site/scylla-narration-requirements.txt,
# and set enabled:false (or delete) site/app/src/lib/narrationAltVoice*.
name: scylla-narration

on:
  workflow_dispatch:
    inputs:
      case_id:
        description: "Docket id, comma-separated ids, or all"
        required: true
        default: "dd-intro"
      clobber_mp3s:
        description: "Replace existing release MP3s (true fresh synthesis publish)"
        type: boolean
        required: false
        default: false
  push:
    branches: [main]
    paths:
      - "site/app/docket/*.json"
      - "site/app/src/lib/narrationAltVoice.ts"
      - "site/app/src/lib/narrationAltVoice.json"
      - "site/app/src/lib/narratorCues.ts"
      - "site/app/src/lib/narratorCueCopy.json"
      - "site/app/src/lib/castGenders.json"
      - "site/scylla-narration-requirements.txt"
      - "site/scripts/build-scylla-jobs.mjs"
      - "site/scripts/scylla-voices.mjs"
      - "site/scripts/generate-scylla-clips.py"
      - "site/scripts/publish-kokoro-clips.mjs"
      - ".github/workflows/scylla-narration.yml"

permissions:
  actions: read
  contents: write

concurrency:
  group: scylla-narration
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      cases: ${{ steps.cases.outputs.value }}
      clobber_mp3s: ${{ steps.cases.outputs.clobber_mp3s }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - id: cases
        shell: bash
        env:
          REQUESTED_CASES: ${{ inputs.case_id }}
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            requested="$REQUESTED_CASES"
          else
            changed="$(git diff --name-only HEAD^ HEAD)"
            deleted_cases="$(git diff --diff-filter=D --name-only HEAD^ HEAD |
              sed -nE 's#^site/app/docket/(dd-[0-9]{4}|dd-intro)\.json$#\1#p')"
            if [[ -n "$deleted_cases" ]] || grep -Eq '^(site/app/src/lib/(narrationAltVoice|narratorCues|castGenders)\.(ts|json)|site/app/src/lib/narratorCueCopy\.json|site/scylla-narration-requirements\.txt|site/scripts/(generate-scylla-clips\.py|scylla-voices\.mjs))$' <<< "$changed"; then
              requested="all"
            else
              requested="$(sed -nE 's#^site/app/docket/(dd-[0-9]{4}|dd-intro)\.json$#\1#p' <<< "$changed" |
                sort -u | paste -sd, -)"
            fi
          fi
          clobber="false"
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            if [[ "${{ inputs.clobber_mp3s }}" == "true" ]]; then
              clobber="true"
            fi
          elif [[ "$requested" == "all" ]]; then
            clobber="true"
          fi
          if [[ -z "$requested" ]]; then
            echo "No scylla narration corpus changes; skipping generation."
            echo "value=[]" >> "$GITHUB_OUTPUT"
            echo "clobber_mp3s=false" >> "$GITHUB_OUTPUT"
          else
            echo "value=$(node site/scripts/build-scylla-jobs.mjs --case "$requested" --list)" >> "$GITHUB_OUTPUT"
            echo "clobber_mp3s=$clobber" >> "$GITHUB_OUTPUT"
          fi
      - name: Create stable GitHub voice-pack releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for shard in $(seq 0 31); do
            tag="narration-scylla-$shard"
            gh release view "$tag" >/dev/null 2>&1 ||
              gh release create "$tag" --title "Scylla's Band experimental narration — shard $shard" \
                --notes "Apache-2.0 Scylla's Band speech (experimental alt voice mode). Removable."
          done

  generate:
    needs: prepare
    if: needs.prepare.outputs.cases != '[]'
    runs-on: ubuntu-latest
    timeout-minutes: 360
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        case_id: ${{ fromJSON(needs.prepare.outputs.cases) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: site/scylla-narration-requirements.txt
      - uses: actions/cache@v4
        with:
          path: .scyllasband
          key: scyllasband-onnx-int8-v2-${{ hashFiles('site/scylla-narration-requirements.txt') }}
          restore-keys: |
            scyllasband-onnx-int8-v2-
      - name: Install Scylla's Band (CPU ONNX INT8)
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          python -m pip install --upgrade pip
          pip install -r site/scylla-narration-requirements.txt
          if [[ -d .scyllasband/.git ]]; then
            git -C .scyllasband fetch --depth 1 origin main
            git -C .scyllasband reset --hard origin/main
          else
            rm -rf .scyllasband
            git clone --depth 1 https://github.com/lowkeytea/scyllasband.git .scyllasband
          fi
          pip install -e .scyllasband
          (
            cd .scyllasband
            python -m scyllasband download --runtime-bundles onnx-int8
            python -m scyllasband validate-bundle scyllasband/models/onnx-int8
          )
          echo "SCYLLA_BUNDLE=${{ github.workspace }}/.scyllasband/scyllasband/models/onnx-int8" >> "$GITHUB_ENV"
      - name: Generate this case
        run: |
          node site/scripts/build-scylla-jobs.mjs \
            --case "${{ matrix.case_id }}" --output .scylla-jobs
          python site/scripts/generate-scylla-clips.py \
            --bundle "$SCYLLA_BUNDLE" \
            ".scylla-jobs/${{ matrix.case_id }}.json" scylla-clips
      - name: Stage clips for one rate-limited publication job
        uses: actions/upload-artifact@v4
        with:
          name: scylla-${{ matrix.case_id }}
          path: scylla-clips/
          retention-days: 1

  publish:
    needs: [prepare, generate]
    if: needs.prepare.outputs.cases != '[]'
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Collect generated case packs
        uses: actions/download-artifact@v4
        with:
          pattern: scylla-*
          path: scylla-clips
          merge-multiple: true
      - name: Publish shard zips + missing MP3s only
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          CLOBBER_MP3S: ${{ needs.prepare.outputs.clobber_mp3s }}
        run: |
          extra=""
          if [[ "$CLOBBER_MP3S" == "true" ]]; then
            extra="--clobber-mp3s"
          fi
          node site/scripts/publish-kokoro-clips.mjs \
            --clips scylla-clips \
            --tag-prefix narration-scylla \
            $extra
