# The Court Week app (site/app) CI: lint, typecheck, test, validate and build.
# Fast build/test gate. The app's output is deployed by site.yml through
# site/public/jury/; this workflow does not deploy on its own.
name: site-app

on:
  pull_request:
    paths:
      - "site/app/**"
      - "site/scripts/scene-art-readiness*.mjs"
      - ".github/workflows/site-app-ci.yml"
  push:
    branches: [main]
    paths:
      - "site/app/**"
      - "site/scripts/scene-art-readiness*.mjs"
      - ".github/workflows/site-app-ci.yml"

permissions:
  contents: read

concurrency:
  group: site-app-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: site-app-check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: site/app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: site/app/package-lock.json
      - name: Install
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Typecheck
        run: npm run typecheck
      - name: Test
        run: npm test
      - name: Audit scene-art contract
        run: npm run media:art:test
      - name: Validate Court Week (schema + legal-quality gate)
        run: npm run validate:cases
      - name: Build
        run: npm run build
      - name: Install browser engines
        run: npx playwright install --with-deps chromium firefox webkit
      - name: Browser and responsive matrix
        run: npm run test:browser
      - name: Production performance budgets
        run: npm run test:performance
      - name: Upload browser QA evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: court-week-browser-qa
          path: |
            site/app/playwright-report/
            site/app/playwright-performance-report/
            site/app/test-results/
          if-no-files-found: ignore
          retention-days: 14
