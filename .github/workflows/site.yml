name: site

# simjury.com (Cloudflare Static Assets) CI/CD.
#   - On PRs touching site/**: build + Court Week checks + wrangler dry-run (no deploy).
#   - On push to main (i.e. AFTER a PR merges through the bot gates): deploy.
# Deploys never run from a PR — only from a merged change on main.

on:
  pull_request:
    paths:
      - "site/**"
      - ".github/workflows/site.yml"
  push:
    branches: [main]
    paths:
      - "site/**"
      - ".github/workflows/site.yml"

permissions:
  contents: read

concurrency:
  group: site-${{ github.ref }}
  cancel-in-progress: false

jobs:
  check:
    name: site-check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Install
        working-directory: site
        run: npm ci
      - name: Enforce assets-only Cloudflare guardrails
        working-directory: site
        run: npm run guard:cloudflare
      - name: Validate Court Week static site
        working-directory: site
        run: npm run check

  deploy:
    name: site-deploy
    needs: check
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Require the pinned immutable media release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: court-week-cw-0001-2026.08.03-r1
        run: |
          set -euo pipefail
          test "$(gh release view "$RELEASE_TAG" --json isDraft,isImmutable --jq '.isDraft == false and .isImmutable == true')" = true
          mkdir -p "$RUNNER_TEMP/court-week-release"
          gh release download "$RELEASE_TAG" --pattern release-manifest.json --dir "$RUNNER_TEMP/court-week-release"
          node -e 'const m=require(process.argv[1]); if(m.release_tag!==process.env.RELEASE_TAG||m.case_id!=="cw-0001") process.exit(1)' "$RUNNER_TEMP/court-week-release/release-manifest.json"
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Install
        working-directory: site
        run: npm ci
      - name: Deploy static assets to Cloudflare
        working-directory: site
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          COURT_WEEK_REQUIRE_PINNED_MEDIA: "1"
        run: npm run deploy
      - name: Notify search indexes
        continue-on-error: true
        working-directory: site
        run: npm run submit:indexnow
