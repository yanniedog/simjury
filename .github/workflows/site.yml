name: site

# simjury.com (Cloudflare Static Assets) CI/CD.
#   - On PRs touching site/**: static, browser and performance checks (no deploy).
#   - On push to main (i.e. AFTER a PR merges through the bot gates): deploy.
# Deploys never run from a PR — only from a merged change on main.

on:
  pull_request:
    paths:
      - "site/**"
      - ".github/workflows/site.yml"
  push:
    branches: [main]
    paths:
      - "site/**"
      - ".github/workflows/site.yml"

permissions:
  contents: read

concurrency:
  group: site-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    name: site-check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Install
        working-directory: site
        run: npm ci
      - name: Enforce assets-only Cloudflare guardrails
        working-directory: site
        run: npm run guard:cloudflare
      - name: Validate Court Week static site
        working-directory: site
        run: npm run check

  app:
    name: site-app-check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: site/app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: site/app/package-lock.json
      - name: Install
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Typecheck
        run: npm run typecheck
      - name: Test
        run: npm test
      - name: Audit scene-art contract
        run: npm run media:art:test
      - name: Validate Court Week (schema + legal-quality gate)
        run: npm run validate:cases
      - name: Build
        run: npm run build
      - name: Install browser engines
        run: npx playwright install --with-deps chromium firefox webkit
      - name: Browser and responsive matrix
        run: npm run test:browser
      - name: Production performance budgets
        run: npm run test:performance
      - name: Upload browser QA evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: court-week-browser-qa
          path: |
            site/app/playwright-report/
            site/app/playwright-performance-report/
            site/app/test-results/
          if-no-files-found: ignore
          retention-days: 14

  deploy:
    name: site-deploy
    needs: [check, app]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Require the pinned immutable media release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: court-week-cw-0001-2026.08.03-r3
        run: |
          set -euo pipefail
          test "$(gh release view "$RELEASE_TAG" --json isDraft,isImmutable --jq '.isDraft == false and .isImmutable == true')" = true
          mkdir -p "$RUNNER_TEMP/court-week-release"
          gh release download "$RELEASE_TAG" --dir "$RUNNER_TEMP/court-week-release"
          node site/scripts/assert-pinned-media-release.mjs \
            --runtime-manifest site/app/media/court-week-media-manifest.pinned.json \
            --release-manifest "$RUNNER_TEMP/court-week-release/release-manifest.json" \
            --review-signoffs site/app/content-reviews/cw-0001.review-signoffs.json \
            --release-assets-dir "$RUNNER_TEMP/court-week-release" \
            --expected-release-tag "$RELEASE_TAG"
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Install exact-source review verifier
        working-directory: site/app
        run: npm ci
      - name: Recompute and require exact deployed-source signoffs
        working-directory: site/app
        env:
          RELEASE_MANIFEST: ${{ runner.temp }}/court-week-release/release-manifest.json
        run: |
          expected_digest="$(node -p 'require(process.env.RELEASE_MANIFEST).review_content_digest')"
          expected_revision="$(node -p 'require(process.env.RELEASE_MANIFEST).court_week_revision')"
          npm run review:signoffs -- \
            --source content-reviews/cw-0001.review-signoffs.json \
            --require-approved \
            --expected-digest "$expected_digest" \
            --expected-revision "$expected_revision"
      - name: Install
        working-directory: site
        run: npm ci
      - name: Stamp the exact deployment identity
        working-directory: site
        env:
          DEPLOY_SHA: ${{ github.sha }}
        run: >-
          node -e "const fs=require('node:fs');
          if(!/^[0-9a-f]{40}$/.test(process.env.DEPLOY_SHA))throw new Error('Invalid deployment SHA');
          fs.mkdirSync('public/.well-known',{recursive:true});
          fs.writeFileSync('public/.well-known/simjury-deployment.json',JSON.stringify({sha:process.env.DEPLOY_SHA})+'\n')"
      - name: Deploy static assets to Cloudflare
        working-directory: site
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          COURT_WEEK_REQUIRE_PINNED_MEDIA: "1"
        run: npm run deploy
      - name: Notify search indexes
        continue-on-error: true
        working-directory: site
        run: npm run submit:indexnow
