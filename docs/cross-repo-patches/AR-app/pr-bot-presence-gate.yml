name: pr-bot-presence-gate

# Hardened presence gate (from simjury / AR-app root-cause fix):
# - OR-group required bots (sourcery|cursor) — Sourcery skips some PRs; Cursor Automation counts
# - In-job retries on exit 2 — first-shot race left sticky red required checks
# - cancel-in-progress: false — cancelled runs must not be the latest required status
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  pull_request_review:
    types: [submitted]
  issue_comment:
    types: [created]
  workflow_dispatch:
    inputs:
      pr_number:
        description: Pull request number
        required: true
        type: string

permissions:
  contents: read
  pull-requests: read
  issues: read

concurrency:
  group: bot-presence-gate-${{ github.event.pull_request.number || github.event.issue.number || inputs.pr_number || github.run_id }}
  cancel-in-progress: false

jobs:
  bot-presence-gate:
    if: >-
      github.event.pull_request != null
      || github.event.review != null
      || (github.event_name == 'issue_comment' && github.event.issue.pull_request != null)
      || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Skip bot wait for non-human / chore PRs
        id: gate_exempt
        env:
          GH_TOKEN: ${{ secrets.BOT_GATE_TOKEN || github.token }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
          PR_AUTHOR_TYPE: ${{ github.event.pull_request.user.type }}
        run: |
          case "${{ github.event_name }}" in
            workflow_dispatch) PR="${{ inputs.pr_number }}" ;;
            issue_comment)     PR="${{ github.event.issue.number }}" ;;
            pull_request_review) PR="${{ github.event.pull_request.number }}" ;;
            *)                 PR="${{ github.event.pull_request.number }}" ;;
          esac
          export PR
          EXEMPT=$(node scripts/pr-gate-exempt-reason.mjs || true)
          if [ -n "$EXEMPT" ]; then
            echo "gate_exempt=true" >> "$GITHUB_OUTPUT"
            echo "gate_exempt_reason=$EXEMPT" >> "$GITHUB_OUTPUT"
          else
            echo "gate_exempt=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Gate exempt - pass (no bot wait)
        if: steps.gate_exempt.outputs.gate_exempt == 'true'
        run: |
          echo "bot-presence-gate: skipped (${{ steps.gate_exempt.outputs.gate_exempt_reason }})"
      - name: Required bot wait gate (with retries)
        if: steps.gate_exempt.outputs.gate_exempt != 'true'
        env:
          GH_TOKEN: ${{ secrets.BOT_GATE_TOKEN || github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          # Sourcery-only was the AR-app root cause: Sourcery skips docs PRs while
          # Cursor Automation still reviews. OR-group accepts either.
          AR_BOT_WAIT_REQUIRED: ${{ vars.AR_BOT_WAIT_REQUIRED || 'sourcery|cursor|coderabbit' }}
          BOT_WAIT_IGNORE_CHECK_NAMES: bot-presence-gate,bot-feedback-gate,pr-bot-presence-gate,pr-bot-feedback-check,mobile-ci
          BOT_WAIT_MAX_MIN: "240"
        run: |
          case "${{ github.event_name }}" in
            workflow_dispatch) PR="${{ inputs.pr_number }}" ;;
            issue_comment)     PR="${{ github.event.issue.number }}" ;;
            pull_request_review) PR="${{ github.event.pull_request.number }}" ;;
            *)                 PR="${{ github.event.pull_request.number }}" ;;
          esac
          attempts=0
          max_attempts=12
          while [ "$attempts" -lt "$max_attempts" ]; do
            attempts=$((attempts + 1))
            set +e
            npm run wait-for-bots -- --pr "$PR"
            code=$?
            set -e
            if [ "$code" -eq 0 ]; then
              exit 0
            fi
            if [ "$code" -ne 2 ] || [ "$attempts" -ge "$max_attempts" ]; then
              if [ "$code" -eq 2 ]; then
                echo "::warning::Bot wait not ready after ${max_attempts} attempts — re-fires on review/comment"
              fi
              exit 1
            fi
            echo "Bot wait not ready; retry ${attempts}/${max_attempts} in 30s..."
            sleep 30
          done
