name: pr-coderabbit-rate-limit-retry

# When CodeRabbit posts "Review limit reached", do NOT sleep in Actions
# (long sleeps were cancelled — 0 successful completes in audit).
# This workflow only validates the event; the 15-minute
# pr-coderabbit-ensure-review scheduler posts @coderabbitai full review when due.
on:
  issue_comment:
    types: [created]
  workflow_dispatch:
    inputs:
      pr_number:
        description: Pull request number
        required: true
        type: string

permissions:
  contents: read
  pull-requests: write
  issues: write

concurrency:
  group: pr-coderabbit-rate-limit-note-${{ github.event.issue.number || inputs.pr_number || github.run_id }}
  cancel-in-progress: false

jobs:
  note-rate-limit-for-scheduler:
    if: >-
      github.event_name == 'workflow_dispatch'
      || (
        github.event.issue.pull_request != null
        && (
          github.event.comment.user.login == 'coderabbitai[bot]'
          || github.event.comment.user.login == 'coderabbitai'
        )
        && (
          contains(github.event.comment.body, 'Review limit reached')
          || contains(github.event.comment.body, 'rate limited by coderabbit.ai')
          || contains(github.event.comment.body, 'reached your PR review limit')
        )
      )
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Arm scheduler (post now only if wait already elapsed)
        env:
          GH_TOKEN: ${{ secrets.BOT_GATE_TOKEN || github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          EVENT_NAME: ${{ github.event_name }}
          INPUT_PR: ${{ inputs.pr_number }}
          ISSUE_PR: ${{ github.event.issue.number }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            PR="${INPUT_PR}"
          else
            PR="${ISSUE_PR}"
          fi
          if [ -z "${PR:-}" ] || [ "$PR" = "null" ]; then
            echo "No PR number; skip"
            exit 0
          fi
          # --if-due: post immediately when quota window already elapsed; otherwise
          # exit 0 and let pr-coderabbit-ensure-review (*/15) fire later. No sleep.
          npm run pr:coderabbit-rate-limit-retry -- --pr "$PR" --if-due
