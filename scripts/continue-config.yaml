name: Local Ollama PR Review
version: 1.0.0
schema: v1

models:
  - name: Qwen2.5-Coder 7B
    provider: ollama
    model: qwen2.5-coder:7b
    apiBase: http://localhost:11434
    roles:
      - chat
      - edit
      - apply
    defaultCompletionOptions:
      temperature: 0.2
      contextLength: 16384
      maxTokens: 4096

  - name: Qwen2.5-Coder 1.5B Autocomplete
    provider: ollama
    model: qwen2.5-coder:1.5b
    apiBase: http://localhost:11434
    roles:
      - autocomplete
    autocompleteOptions:
      debounceDelay: 250
      maxPromptTokens: 1024

prompts:
  - name: PR review
    description: Defect-first review of the current selection or @diff
    prompt: |
      You are a senior code reviewer. Review the provided diff or code.

      Rules:
      - Be defect-first: bugs, security issues, regressions, broken contracts, missing tests.
      - Cite file paths and approximate lines when possible.
      - Skip style nits unless they hide a real bug.
      - Do not invent issues. If the change looks sound, say so briefly.
      - Prefer actionable fixes over vague advice.

      Output format:
      1. Summary (1-2 sentences)
      2. Findings (ordered by severity: blocker / major / minor)
      3. Residual risks / test gaps

      Code/diff:
      {{{ input }}}
