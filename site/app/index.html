      body { margin: 0; background: #090d0f; color: #f2ead8; font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      .cw-boot-shell { box-sizing: border-box; min-height: 100vh; min-height: 100svh; display: grid; place-content: center; padding: max(1.25rem, env(safe-area-inset-top)) max(1.25rem, env(safe-area-inset-right)) max(1.25rem, env(safe-area-inset-bottom)) max(1.25rem, env(safe-area-inset-left)); }

  <body data-clarity-mask="true">
