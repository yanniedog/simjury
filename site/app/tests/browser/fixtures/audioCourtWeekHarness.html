<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Court Week recorded-audio fixture</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module">
      import { mountRecordedAudioCourt } from './audioCourtWeekHarness.tsx'

      const instant = Number(new URLSearchParams(window.location.search).get('instant'))
      const host = document.querySelector('#root')
      if (!(host instanceof HTMLElement) || !Number.isFinite(instant)) {
        throw new Error('The recorded-audio fixture requires a host and a finite instant.')
      }
      mountRecordedAudioCourt(host, instant)
    </script>
  </body>
</html>
